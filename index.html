<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qrew — Multi-Tenant Access Control Platform</title>
  <meta name="description" content="Enterprise multi-tenant management and hierarchical access-control platform.">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Critical Anti-FOWC (Flash of White Content) Early Theme Initialization -->
  <script>
    (function() {
      try {
        var urlTheme = new URLSearchParams(window.location.search).get('theme');
        var theme = urlTheme || localStorage.getItem('qrew_ui_theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#0B1220';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.removeAttribute('data-theme');
          document.documentElement.style.backgroundColor = '#F8FAFC';
          document.documentElement.style.colorScheme = 'light';
        }
        var secondary = localStorage.getItem('qrew_ui_secondary') || localStorage.getItem('qrew_ui_accent');
        if (secondary && secondary !== 'default') {
          document.documentElement.style.setProperty('--color-secondary', secondary);
          document.documentElement.style.setProperty('--panel-accent', secondary);
          document.documentElement.style.setProperty('--color-accent', secondary);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html {
      background-color: #0B1220;
    }
    html:not([data-theme="dark"]) {
      background-color: #F8FAFC;
    }
    body {
      background-color: inherit;
      color: inherit;
    }
  </style>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/tokens.css?v=3">
  <link rel="stylesheet" href="styles/shell.css?v=3">
  <link rel="stylesheet" href="styles/components.css?v=3">
  <link rel="stylesheet" href="interfaces/landing/landing.css?v=3">
  <link rel="stylesheet" href="interfaces/department/department.css">
  <link rel="stylesheet" href="interfaces/member/member.css">
  <link rel="stylesheet" href="interfaces/office-config/office-config.css">
</head>

<body>
  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <div class="brand-wrapper" id="brand-wrapper" title="Go to Platform Landing Page">
          <div class="brand-logo has-img" id="sidebar-brand-logo"><img src="assets/logo.png" alt="Qrew Logo"
              class="brand-logo-img"></div>
          <div class="brand-info" id="sidebar-brand-info">
            <span class="brand-name" id="sidebar-brand-name">Qrew</span>
            <span class="brand-badge" id="sidebar-brand-badge">Platform Level</span>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Collapse sidebar (Ctrl+B)"
          aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            <line x1="9" x2="9" y1="3" y2="21" />
            <path d="m14 9-3 3 3 3" />
          </svg>
        </button>
      </div>

      <!-- Context Selector (Tenant or Office Switcher) -->
      <div class="sidebar-context-picker" id="sidebar-context-picker" style="display:none;">
        <span class="sidebar-context-label" id="sidebar-context-label">Select Tenant</span>
        <select class="sidebar-context-select" id="sidebar-context-select"
          aria-label="Switch organization or branch"></select>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Dynamically rendered based on active workspace: Platform, Tenant Workspace, Office Workspace -->
      </nav>

      <div class="sidebar-footer" id="sidebar-footer" style="display:none;"></div>

      <!-- Draggable Sidebar Resizer -->
      <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize sidebar (double-click to reset)"></div>
    </aside>

    <!-- Sidebar Mobile Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open sidebar menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" x2="20" y1="12" y2="12" />
              <line x1="4" x2="20" y1="6" y2="6" />
              <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
          </button>
          <div class="topbar-profile-brand" id="topbar-profile-brand">
            <div class="brand-logo"
              style="width:28px;height:28px;font-size:13px;border-radius:6px;background:var(--panel-accent, var(--color-accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">
              Q</div>
            <span style="font-weight:700;font-size:14px;color:var(--color-text-primary);">Qrew</span>
          </div>
          <a href="#landing" class="topbar-platform-btn topbar-landing-btn" id="topbar-landing-btn"
            title="Go to Qrew Landing Page" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
            <span>Qrew Landing</span>
          </a>
        </div>

        <div class="topbar-center" id="topbar-center">
          <div class="topbar-domain-badge">
            <span class="topbar-domain-dot"></span>
            <span id="topbar-domain-text">url: app.qrew.com/admin</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="topbar-actions">
            <!-- Theme Toggle (Dashed Circle) -->
            <button type="button" class="topbar-theme-toggle" id="topbar-theme-toggle" title="Toggle Theme (Light / Dark)" aria-label="Toggle Theme">
              <span class="theme-toggle-icon-sun" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
              </span>
              <span class="theme-toggle-icon-moon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              </span>
            </button>

            <!-- Notifications Trigger -->
            <button class="icon-btn" id="notifications-trigger" title="Recent Activity Notifications"
              aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
              <span class="notification-badge"></span>
            </button>

            <!-- Notifications Popover -->
            <div class="notifications-popover" id="notifications-popover">
              <div class="notifications-header">
                <span class="notifications-title">System Activities</span>
                <span style="font-size:11px;color:var(--color-text-muted);">Recent Events</span>
              </div>
              <div class="notifications-list" id="notifications-list"></div>
            </div>
          </div>

          <!-- User Profile Trigger & Menu -->
          <div class="user-profile-menu">
            <button class="user-profile-trigger" id="user-profile-trigger" aria-haspopup="true">
              <div class="user-avatar" id="topbar-user-avatar">S</div>
              <div class="user-meta">
                <span class="user-name" id="topbar-user-name">Sakib</span>
                <span class="user-role-tag" id="topbar-user-role">Platform Admin</span>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-text-muted);">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>

            <!-- User Dropdown Menu -->
            <div class="dropdown-menu" id="user-dropdown-menu">
              <div class="dropdown-header" id="dropdown-header-btn" style="cursor:pointer;"
                title="Click to edit profile">
                <div class="dropdown-user-title" id="dropdown-user-title">Sakib</div>
                <div class="dropdown-user-email" id="dropdown-user-email">sakib@qrew.io</div>
                <div class="dropdown-user-role" id="dropdown-user-role"
                  style="font-size:11px;color:var(--panel-accent, var(--color-accent));font-weight:600;margin-top:2px;">
                  Platform Admin</div>
              </div>
              <div class="dropdown-item" id="action-my-profile">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                My Profile
              </div>
              <div class="dropdown-item danger" id="action-logout">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" x2="9" y1="12" y2="12" />
                </svg>
                Logout
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="content-area" id="main-content" role="main">
        <!-- Rendered by active interface module -->
      </main>
    </div>
  </div>

  <!-- Core -->
  <script src="core/ui.js"></script>
  <script src="core/data.js"></script>
  <script src="core/app.js"></script>
  <script src="core/router.js"></script>
  <script src="core/shell.js"></script>

  <!-- Wireframe-Only Helpers -->
  <script src="wireframe/personas.js"></script>

  <!-- Interfaces -->
  <script src="interfaces/landing/platform-landing.js"></script>
  <script src="interfaces/landing/tenant-landing.js"></script>
  <script src="interfaces/platform/tenants.js"></script>
  <script src="interfaces/platform/index.js"></script>
  <script src="interfaces/profile/index.js"></script>
  <script src="interfaces/super-admin/index.js"></script>
  <script src="interfaces/tenant/overview.js"></script>
  <script src="interfaces/tenant/offices.js"></script>
  <script src="interfaces/tenant/members.js"></script>
  <script src="interfaces/tenant/roles.js"></script>
  <script src="interfaces/tenant/settings.js"></script>
  <script src="interfaces/tenant/index.js"></script>
  <script src="interfaces/tenant-super-admin/index.js"></script>
  <script src="interfaces/office-config/components/segmented-pills.js"></script>
  <script src="interfaces/office-config/invoice-templates.js"></script>
  <script src="interfaces/office-config/index.js"></script>
  <script src="interfaces/office/index.js"></script>
  <script src="interfaces/office-admin/index.js"></script>
  <script src="interfaces/department/index.js"></script>
  <script src="interfaces/member/index.js"></script>
</body>

</html>
